apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    orgId: 1

  - name: PostgreSQL
    type: postgresql
    access: proxy
    url: postgres:5432
    database: invoice_resolver
    user: postgres
    secureJSONData:
      password: ''
    jsonData:
      sslmode: "disable"
    editable: true
    orgId: 1
