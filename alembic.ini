# Alembic configuration for Invoice Resolver AI.

[alembic]
# Path to migration scripts
script_location = alembic

# Database connection URL (can be overridden by env var)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/invoice_resolver

# Template for migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when generating the 'Created' and 'Updated' revision identifiers
timezone = utc

# Whether to check for transaction boundaries
# See https://alembic.sqlalchemy.org/en/latest/api/runtime.html#alembic.runtime.environment.EnvironmentContext.configure
# for additional parameters
transaction_per_migration = true

# Set to 'true' to have Alembic automatically generate a "slug" for the revision id
# from the user-provided message
#slug = true

# Set to 'true' to have Alembic automatically generate a "branch" for the revision id
# from the user-provided message
#branch = true

# Output encoding
encoding = utf8

# Set to 'true' to have the script auto-generate a "down" revision
# downgrade = true

# Set to 'true' to have the script auto-generate a "up" revision
# upgrade = true

# -------------------------------------------------------------------------
# Logging configuration
# -------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
