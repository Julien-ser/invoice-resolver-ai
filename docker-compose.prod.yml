version: '3.8'

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
  paypal_client_secret:
    file: ./secrets/paypal_client_secret.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  postgres:
    image: postgres:15-alpine
    container_name: invoice_resolver_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-invoice_resolver}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - invoice_resolver_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all

  redis:
    image: redis:7-alpine
    container_name: invoice_resolver_redis
    restart: always
    command: >
      redis-server
      --requirepass $$(cat /run/secrets/redis_password)
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - invoice_resolver_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_resolver_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-invoice_resolver}
      REDIS_URL: redis://:$(cat /run/secrets/redis_password)@redis:6379/0
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      PAYPAL_CLIENT_SECRET_FILE: /run/secrets/paypal_client_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-4}
    secrets:
      - jwt_secret
      - stripe_webhook_secret
      - paypal_client_secret
      - openai_api_key
      - redis_password
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./alembic:/app/alembic
    networks:
      - invoice_resolver_network
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: invoice_resolver_celery
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-invoice_resolver}
      REDIS_URL: redis://:$(cat /run/secrets/redis_password)@redis:6379/0
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      PAYPAL_CLIENT_SECRET_FILE: /run/secrets/paypal_client_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_secret
      - stripe_webhook_secret
      - paypal_client_secret
      - openai_api_key
      - redis_password
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./alembic:/app/alembic
    networks:
      - invoice_resolver_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: invoice_resolver_beat
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-invoice_resolver}
      REDIS_URL: redis://:$(cat /run/secrets/redis_password)@redis:6379/0
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      PAYPAL_CLIENT_SECRET_FILE: /run/secrets/paypal_client_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_secret
      - stripe_webhook_secret
      - paypal_client_secret
      - openai_api_key
      - redis_password
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./alembic:/app/alembic
    networks:
      - invoice_resolver_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.celery_app:celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  invoice_resolver_network:
    driver: bridge
